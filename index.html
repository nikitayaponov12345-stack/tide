<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Прилив</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b2a3a;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: system-ui, sans-serif;
        color: #fff;
      }
      #ui .debug-panel {
        position: absolute;
        left: 8px;
        bottom: 8px;
        right: 8px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      #ui .debug-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #ui button {
        pointer-events: auto;
        font: inherit;
        font-size: 14px;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
        touch-action: manipulation;
      }
      #ui button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #ui .summary-shade {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        pointer-events: auto;
      }
      #ui .summary-shade[hidden] {
        display: none;
      }
      #ui .summary {
        box-sizing: border-box;
        width: min(420px, calc(100% - 32px));
        max-height: calc(100% - 32px);
        overflow: auto;
        padding: 16px;
        border-radius: 10px;
        background: #12384c;
        border: 2px solid rgba(255, 255, 255, 0.7);
      }
      #ui .summary h2 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      #ui .summary-scheme {
        margin: 0 0 10px;
        opacity: 0.85;
      }
      #ui .summary table {
        width: 100%;
        border-collapse: collapse;
        font-size: 16px;
      }
      #ui .summary td {
        padding: 4px 0;
      }
      #ui .summary td:last-child {
        text-align: right;
        font-weight: 700;
      }
      #ui .summary-buttons {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      #ui .summary-buttons button {
        flex: 1;
        padding: 12px 8px;
        font-size: 16px;
      }
      #ui .hud {
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.35);
        font-size: 13px;
        line-height: 1.3;
      }
      #ui .xpbar {
        position: absolute;
        box-sizing: border-box;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      #ui .xpbar-fill {
        height: 100%;
        background: #9be564;
      }
      #ui .xpbar-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        text-shadow: 0 1px 2px #000;
      }
      #ui .newlevel {
        position: absolute;
        transform: translateX(-50%);
        font-size: 22px;
        font-weight: 800;
        color: #ffd166;
        text-shadow: 0 2px 4px #000;
        white-space: nowrap;
      }
      #ui .newlevel[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
