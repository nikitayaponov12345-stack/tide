<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Прилив</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b2a3a;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: system-ui, sans-serif;
        color: #fff;
      }
      #ui .debug-panel {
        position: absolute;
        right: 8px;
        bottom: 8px;
        max-width: 45%;
        text-align: right;
        pointer-events: none;
      }
      #ui button {
        pointer-events: auto;
        font: inherit;
        font-size: 14px;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
        touch-action: manipulation;
      }
      #ui button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #ui .hud {
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.35);
        font-size: 11px;
        line-height: 1.3;
      }
      #ui .xpbar {
        position: absolute;
        box-sizing: border-box;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      #ui .xpbar-fill {
        height: 100%;
        background: #9be564;
      }
      #ui .xpbar.boss .xpbar-fill {
        background: #e63946;
      }
      #ui .xpbar-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        text-shadow: 0 1px 2px #000;
      }
      #ui [hidden] {
        display: none !important;
      }
      #ui .cards-dim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        pointer-events: auto;
      }
      #ui .cards-panel {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      #ui .cards-title,
      #ui .cards-sub {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        text-shadow: 0 2px 4px #000;
      }
      #ui .cards-title {
        font-size: 60px;
        font-weight: 800;
        color: #ffd166;
      }
      #ui .cards-sub {
        font-size: 34px;
      }
      #ui .card {
        position: absolute;
        box-sizing: border-box;
        display: flex;
        gap: 20px;
        padding: 20px;
        text-align: left;
        background: #18394a;
        border: 3px solid rgba(255, 255, 255, 0.35);
        border-radius: 16px;
      }
      #ui .card:disabled {
        opacity: 1;
        cursor: default;
      }
      #ui .card.unavailable {
        opacity: 0.65;
      }
      #ui .card.selected {
        border-color: #ffd166;
        background: #24506a;
        box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.5);
      }
      #ui .card-row {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      #ui .card-stack {
        flex-direction: row;
        align-items: center;
      }
      #ui .card-pic {
        flex: none;
        width: 120px;
        height: 120px;
        border-radius: 12px;
      }
      #ui .card-name {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      #ui .card-desc,
      #ui .card-reason {
        font-size: 26px;
        line-height: 1.25;
      }
      #ui .card-reason {
        color: #ff6b6b;
      }
      #ui .cards-take {
        position: absolute;
        font-size: 34px;
        font-weight: 700;
        background: #2a9d4f;
        border: 3px solid #fff;
        border-radius: 14px;
      }
      #ui .cards-take:disabled {
        opacity: 1;
      }
      #ui .card-unlock {
        position: absolute;
        font-size: 24px;
        font-weight: 700;
        background: #d97706;
        border: 3px solid #fff;
        border-radius: 12px;
        padding: 0;
        white-space: nowrap;
      }
      #ui .card-unlock:disabled {
        opacity: 1;
      }
      #ui .cards-refresh {
        position: absolute;
        font-size: 24px;
        font-weight: 700;
        background: #d97706;
        border: 3px solid #fff;
        border-radius: 12px;
        padding: 0;
        white-space: nowrap;
      }
      #ui .cards-refresh:disabled {
        opacity: 1;
      }
      #ui .place {
        position: absolute;
        font-weight: 700;
        background: #2a9d4f;
        border: 2px solid #fff;
        border-radius: 12px;
        padding: 0;
      }
      #ui .slot {
        position: absolute;
        box-sizing: border-box;
        padding: 0;
        font-weight: 700;
        line-height: 1.1;
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.45);
      }
      #ui .slot.selected {
        border-color: #ffd166;
        background: rgba(36, 80, 106, 0.9);
        box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.55);
      }
      /* Молоток — как слот оружия; danger — красная рамка, active — подсветка выбранного слота, оба сразу — красная рамка с подсветкой. */
      #ui .repair-btn {
        position: absolute;
        box-sizing: border-box;
        padding: 0;
        font-weight: 700;
        line-height: 1.1;
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.45);
      }
      #ui .repair-btn.active {
        border-color: #ffd166;
        background: rgba(36, 80, 106, 0.9);
        box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.55);
      }
      #ui .repair-btn.danger {
        border-color: #ff4d4d;
      }
      #ui .boost-offer-btn {
        position: absolute;
        box-sizing: border-box;
        padding: 0 0.4em;
        font-weight: 700;
        line-height: 1.1;
        border: 2px solid #ffd166;
        border-radius: 12px;
        background: rgba(36, 80, 106, 0.9);
      }
      #ui .walk-hint {
        position: absolute;
        box-sizing: border-box;
        padding: 0.3em 0.6em;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.45);
        line-height: 1.25;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #ui .resume-plaque {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 0.3em 0.8em;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.55);
        white-space: nowrap;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #ui .pause-btn {
        position: absolute;
        box-sizing: border-box;
        padding: 0;
        font-weight: 700;
        border-radius: 10px;
      }
      /* Поверх всех кнопок поля, в том числе созданных позже: на паузе ни «Поставить», ни слоты не нажимаются. */
      #ui .pause-dim {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: rgba(0, 0, 0, 0.7);
        pointer-events: auto;
      }
      #ui .pause-panel {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      #ui .pause-col {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 520px;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      #ui .pause-title {
        text-align: center;
        font-size: 60px;
        font-weight: 800;
        color: #ffd166;
        text-shadow: 0 2px 4px #000;
      }
      #ui .pause-item {
        position: relative;
        height: 84px;
        font-size: 30px;
        font-weight: 700;
        background: #18394a;
        border: 3px solid rgba(255, 255, 255, 0.6);
        border-radius: 14px;
        overflow: hidden;
      }
      #ui .pause-item.selected {
        border-color: #ffd166;
        background: #24506a;
        box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.5);
      }
      #ui .pause-langs {
        display: flex;
        gap: 20px;
      }
      #ui .pause-langs .pause-item {
        flex: 1;
      }
      #ui .pause-erase {
        background: #6a2424;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #ui .pause-erase span {
        position: relative;
      }
      #ui .pause-erase-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: #d64545;
      }
      #ui .pause-hint {
        margin-top: -12px;
        text-align: center;
        font-size: 24px;
        text-shadow: 0 1px 2px #000;
      }
      /* «Локация пройдена» (M1-15): как пауза, поверх всех кнопок поля. */
      #ui .cleared-dim {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: rgba(0, 0, 0, 0.7);
        pointer-events: auto;
      }
      #ui .cleared-panel {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      #ui .cleared-col {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 600px;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        gap: 24px;
        text-align: center;
        text-shadow: 0 2px 4px #000;
      }
      #ui .cleared-title {
        font-size: 60px;
        font-weight: 800;
        color: #ffd166;
      }
      #ui .cleared-sub {
        margin-top: -16px;
        font-size: 34px;
      }
      #ui .cleared-chest {
        font-size: 36px;
        font-weight: 700;
        color: #9be564;
      }
      /* «Сундук ×2 за рекламу» (M1-17) — цвет кнопок рекламы за награду, как «Открыть за рекламу». */
      #ui .cleared-double {
        height: 84px;
        font-size: 30px;
        font-weight: 700;
        background: #d97706;
        border: 3px solid #fff;
        border-radius: 14px;
        white-space: nowrap;
      }
      #ui .cleared-play {
        height: 84px;
        font-size: 30px;
        font-weight: 700;
        background: #2a9d8f;
        border: 3px solid #fff;
        border-radius: 14px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
