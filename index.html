<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Прилив</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b2a3a;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: system-ui, sans-serif;
        color: #fff;
      }
      #ui .hud {
        position: absolute;
        left: 8px;
        bottom: 8px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.35);
        font-size: 13px;
        line-height: 1.3;
      }
      #ui .xpbar {
        position: absolute;
        box-sizing: border-box;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      #ui .xpbar-fill {
        height: 100%;
        background: #9be564;
      }
      #ui .xpbar-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        text-shadow: 0 1px 2px #000;
      }
      #ui .newlevel {
        position: absolute;
        transform: translateX(-50%);
        font-size: 22px;
        font-weight: 800;
        color: #ffd166;
        text-shadow: 0 2px 4px #000;
        white-space: nowrap;
      }
      #ui .newlevel[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
